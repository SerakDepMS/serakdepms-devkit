name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

jobs:
  analyze:
    name: Analyze code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            paths: python-data-science
          - language: javascript-typescript
            paths: web-development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if source code exists
        id: check_code
        run: |
          if [ -z "$(find ${{ matrix.paths }} -type f \( -name '*.py' -o -name '*.js' -o -name '*.ts' \) 2>/dev/null)" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⏭️ No source code found in ${{ matrix.paths }}"
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✅ Source code found in ${{ matrix.paths }}"
          fi

      - name: Initialize CodeQL
        if: steps.check_code.outputs.found == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: steps.check_code.outputs.found == 'true'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        if: steps.check_code.outputs.found == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"